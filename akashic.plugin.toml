schema_version = 1
name = "fitbit"
version = "3.2.3"
api_version = 3
entrypoint = "plugin.py"

[[python]]
requirements = "requirements.txt"

[validation]
exclude_data_paths = [
  "monitor.config.toml",
  "monitor.config.local.toml",
  "tokens.json",
  "sleep_log.jsonl",
  "sleep_labels.json",
  "sleep_model.pkl",
  "stat_events.json",
  "stat_events_v2.json",
  "mobile_sleep_projection.json",
  "monitor.runtime.log",
  "backups",
  "logs",
  ".fitbit-v2-migration.json",
]

[[processes]]
name = "monitor"
command = ["python", "monitor/server.py"]
cwd = "."
port_env = "FITBIT_MONITOR_PORT"
formal_port = 18765
readiness_path = "/api/data"
startup_timeout_seconds = 15.0

[[mcp]]
name = "fitbit"
command = ["python", "run_mcp.py"]
required_tools = [
  "fitbit_health_snapshot",
  "fitbit_sleep_report",
]
candidate_read_only_tools = ["fitbit_health_snapshot", "fitbit_sleep_report"]
endpoint_env = [{env = "FITBIT_MONITOR_PORT", process = "monitor"}]
candidate_env = {FITBIT_BACKEND = "recording"}
