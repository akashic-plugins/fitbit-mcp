name: Sync Akashic fleet

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-akashic-fleet
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout aggregate repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kachofugetsu09/akashic-fleet
          ref: main
          ssh-key: ${{ secrets.AKASHIC_FLEET_WRITE_KEY }}
      - name: Update this submodule
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'akashic-fleet[bot]'
          git config user.email 'akashic-fleet@users.noreply.github.com'
          python3 scripts/sync.py --repository "$SOURCE_REPOSITORY"
