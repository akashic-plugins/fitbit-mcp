name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: 79b80a475936bb86895a1893aaebe321918f8d74
          path: .akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .akashic-core/requirements.txt
            requirements.txt
      - name: Stage exact Fitbit runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            -r .akashic-core/requirements.txt \
            -r .akashic-core/requirements-dev.txt \
            -r requirements.txt
      - name: Verify Fitbit v3 composition
        env:
          AKASHIC_AGENT_ROOT: .akashic-core
          AKASHIC_PLUGIN_FIXTURE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PYTHONPATH: .akashic-core:${{ github.workspace }}/.akashic-core/sdk/python/src
        run: .venv/bin/python -m pytest -q tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify Fitbit panels
        run: |
          npm ci
          npm test
      - name: Check v3 source types
        env:
          PYTHONPATH: .akashic-core:${{ github.workspace }}/.akashic-core/sdk/python/src
        run: >-
          .venv/bin/pyright --pythonpath .venv/bin/python --level error
          plugin.py dashboard.py src/content_adapter.py src/mcp_bridge.py
          monitor/runtime_env.py
          scripts/migrate_v2_data.py
          tests/test_plugin.py tests/test_content_adapter.py tests/test_dashboard.py
          tests/test_manager_integration.py tests/test_mcp_v3_runtime.py
          tests/test_migrate_v2_data.py tests/test_runtime_env.py
      - name: Compile Python sources
        run: python -m compileall -q plugin.py dashboard.py src monitor scripts tests
      - name: Check diff formatting
        run: git diff --check
